ru:
  app_name: Goalner

  api_docs:
    title: Справочник API
    tokens: Ваши API-токены

  layout:
    language: Язык
    sign_in: Войти
    sign_up: Регистрация
    sign_out: Выйти
    open_app: Открыть Goalner

  landing:
    title: Goalner — минималистичная система управления проектами
    description: Простой способ управления проектами. Без лишней суеты.
    hero_title: Простой способ управления проектами
    hero_subtitle: Без лишних ограничений
    start_free: Начните — это бесплатно!
    organize_title: Организуй это, организуй то
    organize_deadlines: Ставь дедлайны, расставляй приоритеты и планируй работу на месяцы вперёд.
    organize_teams: Создавай команды и достигайте целей вместе, а мы поможем вам.
    lets_go: Поехали
    infinity_title: В бесконечность и далее
    infinity_text: Веди столько проектов, сколько необходимо, с любым количеством участников.
    simple_title: Проще некуда
    simple_text: Позволь команде работать, а не разбираться в сложностях организации процессов.
    deadlines_title: Ни один дедлайн не будет пропущен
    deadlines_text: Goalner подскажет, в каких проектах есть трудности, а в каких всё идёт по плану.
    images:
      board: Доска проекта в Goalner
      kanban: Задачи движутся по колонкам доски
      infinity: Знак бесконечности
      person: Человек за работой

  sessions:
    new:
      title: Вход
      submit: Войти
      forgot_password: Забыли пароль?
      no_account: Ещё нет аккаунта?
      resend_confirmation: Не пришло письмо с подтверждением?
      locked: Аккаунт заблокирован?
    invalid: Неверный email или пароль.
    unconfirmed: Сначала подтвердите адрес электронной почты. Мы можем отправить ссылку ещё раз.

  registrations:
    new:
      title: Создайте аккаунт
      submit: Зарегистрироваться
      have_account: Уже есть аккаунт?
      password_hint: Не меньше 12 символов.
    check_email: Проверьте почту, чтобы завершить регистрацию.

  confirmations:
    new:
      title: Отправить ссылку для подтверждения
      submit: Отправить ссылку
    show:
      title: Подтвердите адрес электронной почты
      text: Подтвердите %{email}, чтобы завершить создание аккаунта.
      submit: Подтвердить email
    sent: Если у этого адреса есть неподтверждённый аккаунт, мы отправили новую ссылку.
    confirmed: Адрес подтверждён. Теперь можно войти.
    invalid: Ссылка для подтверждения недействительна или устарела. Мы можем отправить новую.

  unlocks:
    new:
      title: Разблокировать аккаунт
      submit: Отправить ссылку
    show:
      title: Разблокировать аккаунт
      text: Разблокировать аккаунт %{email}.
      submit: Разблокировать
    sent: Если этот аккаунт заблокирован, мы отправили ссылку для разблокировки.
    unlocked: Аккаунт разблокирован. Теперь можно войти.
    invalid: Ссылка для разблокировки недействительна или устарела. Мы можем отправить новую.

  passwords:
    new:
      title: Забыли пароль?
      submit: Отправить инструкции
    edit:
      title: Новый пароль
      submit: Сохранить пароль
    sent: Если аккаунт с этим адресом существует, мы отправили ссылку для сброса пароля.
    reset: Пароль изменён. Войдите с новым паролем.
    invalid: Ссылка для сброса пароля недействительна или устарела. Запросите новую ниже.

  invitations:
    sent: Приглашение отправлено.
    show:
      title: Вас пригласили
      text: "%{inviter} приглашает вас в проект «%{project}» в Goalner."
      sign_in_to_accept: Войдите или создайте аккаунт с адресом %{email}, чтобы принять приглашение.
      sign_in: Войти и принять
      sign_up: Создать аккаунт
      accept: Принять приглашение
      other_address: Это приглашение отправлено на другой адрес. Войдите с этим адресом, чтобы принять его.
    invalid:
      title: Приглашение недоступно
      text: Ссылка недействительна, устарела или уже использована. Попросите участника проекта пригласить вас снова.

  invitation_mailer:
    invite:
      subject: "Приглашение в проект %{project} в Goalner"
      text: "%{inviter} приглашает вас присоединиться к проекту «%{project}» в Goalner."
      action: Открыть приглашение
      expiry: Ссылка действует 7 дней. Если у вас ещё нет аккаунта, его можно создать на той же странице.
      ignore: Если вы не хотите присоединяться, просто проигнорируйте это письмо.

  task_mailer:
    assigned:
      subject: "%{assigner} назначает вам %{key}"
      text: "%{assigner} назначает вам задачу %{key} «%{title}»."
      action: "Открыть %{key}"

  shared:
    rate_limited:
      title: Слишком много попыток
      text: Попробуйте ещё раз позже.
      back: Вернуться ко входу

  spa:
    show:
      title: Goalner
      loading: Goalner загружается…

  forms:
    name: Имя
    email_address: Email
    password: Пароль
    password_confirmation: Повторите пароль
    errors_heading: Исправьте, пожалуйста

  account_mailer:
    confirmation:
      subject: Подтвердите адрес электронной почты
      greeting: Здравствуйте, %{name}!
      text: Подтвердите адрес, чтобы завершить создание аккаунта в Goalner. Ссылка действует 24 часа.
      action: Подтвердить email
      ignore: Если вы не регистрировались в Goalner, просто проигнорируйте это письмо.
    attempted_registration:
      subject: Кто-то пытался зарегистрироваться с вашим адресом
      greeting: Здравствуйте, %{name}!
      text: Кто-то пытался создать новый аккаунт Goalner с вашим адресом. У вас уже есть аккаунт, поэтому ничего не изменилось.
      sign_in: Если это были вы, войдите здесь
      reset: или сбросьте пароль, если забыли его.
      ignore: Если это были не вы, просто проигнорируйте это письмо.
    unlock:
      subject: Ваш аккаунт Goalner заблокирован
      greeting: Здравствуйте, %{name}!
      text: Аккаунт заблокирован после слишком большого числа неудачных попыток ввода пароля. Он разблокируется автоматически через час, или вы можете разблокировать его сейчас.
      action: Разблокировать аккаунт
      ignore: Если это были не ваши попытки, смените пароль после разблокировки.

  passwords_mailer:
    reset:
      subject: Сброс пароля
      greeting: Здравствуйте, %{name}!
      text: Перейдите по ссылке ниже, чтобы выбрать новый пароль. Ссылка действует 15 минут.
      action: Выбрать новый пароль
      ignore: Если вы не запрашивали сброс пароля, просто проигнорируйте это письмо.

  activerecord:
    errors:
      models:
        api_token:
          attributes:
            base:
              too_many: "Можно иметь не больше %{count} действующих API-токенов. Отзовите один, чтобы создать новый."
        task:
          attributes:
            base:
              archived: Задачи в архиве нельзя изменять
    attributes:
      api_token:
        name: Название
        project_id: Проект
        access: Доступ
        expires_in_days: Срок действия
      user:
        name: Имя
        email_address: Email
        password: Пароль
        password_confirmation: Подтверждение пароля
        password_challenge: Текущий пароль
        lang: Язык
        contact_links: Ссылка
        avatar: Аватар

  # Messages Rails ships only in English. Phrased to avoid Russian plural
  # forms, which the default I18n pluralizer does not support.
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: не может быть пустым
      present: должно быть пустым
      taken: уже занято
      invalid: имеет неверное значение
      inclusion: имеет недопустимое значение
      exclusion: имеет зарезервированное значение
      confirmation: не совпадает со значением поля «%{attribute}»
      too_short: "слишком короткое (минимум символов: %{count})"
      too_long: "слишком длинное (максимум символов: %{count})"
      wrong_length: "неверной длины (нужно символов: %{count})"
      password_too_long: слишком длинный
      not_a_number: не является числом
      not_an_integer: должно быть целым числом
      greater_than: "должно быть больше %{count}"
      greater_than_or_equal_to: "должно быть не меньше %{count}"
      less_than: "должно быть меньше %{count}"
      less_than_or_equal_to: "должно быть не больше %{count}"
      equal_to: "должно быть равно %{count}"
      other_than: "должно отличаться от %{count}"
      required: должно существовать
      accepted: нужно подтвердить
      in: "должно быть в диапазоне %{count}"
      odd: должно быть нечётным
      too_large: слишком большой
      content_type_not_allowed: недопустимого типа
      invalid_service: "содержит неизвестный сервис %{service}"
      invalid_url: "для %{service} должна быть https-адресом не длиннее 255 символов"
      not_a_member: должен быть участником проекта
      deleted: удалён
      nested: не может иметь собственных подзадач
      archived: в архиве
      last_column: Нельзя удалить последнюю колонку
      subtask_placement: Подзадачи не размещаются на доске
      before_start: не может быть раньше даты начала
      subtask: нельзя задать для подзадачи
      too_many: "не больше %{count} файлов"
      file_too_large: "%{filename}: файл слишком большой"
      file_content_type_not_allowed: "%{filename}: недопустимый тип файла"
      file_blank: не является файлом
      even: должно быть чётным
  activemodel:
    errors:
      messages:
        password_too_long: слишком длинный
