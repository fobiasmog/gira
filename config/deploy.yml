# Name of your application. Used to uniquely configure containers.
service: goalner

# Name of the container image (use your-user/app-name on external registries).
image: goalner

# Deploy to these servers.
servers:
  web:
    hosts:
      - 192.168.0.1
    # MCP_SERVICE_KEY: the key of the connection token exchange the mcp role
    # calls (add-mcp-oauth design.md, decision 11). MCP_ISSUER and
    # MCP_RESOURCE_URL come from the top-level env.
    env:
      secret:
        - RAILS_MASTER_KEY
        - MCP_SERVICE_KEY
    # Use a persistent storage volume for local Active Storage files.
    # Recommended to change this to a mounted volume path that is backed up off server.
    options:
      volume:
        - "goalner_storage:/rails/storage"
  # The MCP server (bin/mcp; add-mcp-server design.md, decision 10). nginx on
  # the host sends /mcp and the protected resource metadata to the published
  # port. It reaches the API through kamal-proxy on the private kamal network,
  # and receives neither database configuration, RAILS_MASTER_KEY nor the
  # storage volume.
  #
  # OAuth (add-mcp-oauth design.md, decisions 9 and 11): the public keys that
  # verify access tokens (the public half of the credentials'
  # mcp.jwt_private_key; several while rotating). The issuer and the
  # resource come from the top-level env. The service key and Redis for the
  # connection token cache are secrets of this role and, for the key, the
  # web role only.
  mcp:
    hosts:
      - 192.168.0.1
    cmd: bin/mcp
    proxy: false
    options:
      publish:
        - "127.0.0.1:3100:3100"
    env:
      clear:
        GOALNER_API_URL: http://kamal-proxy
        MCP_PUBLIC_URL: https://goalner.com
        MCP_JWT_PUBLIC_KEYS: |
          -----BEGIN PUBLIC KEY-----
          Replace with the public key of the production mcp.jwt_private_key.
          -----END PUBLIC KEY-----
      secret:
        - MCP_SERVICE_KEY
        - REDIS_URL
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# proxy:
#   ssl: true
#   host: app.example.com

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# RAILS_MASTER_KEY is a secret of the web role only, so the mcp role never
# receives it.
env:
  clear:
    # The issuer and the audience of MCP access tokens. Both roles read this
    # one definition, so the web role signs what the mcp role checks
    # (harden-mcp-oauth design.md, decision 9).
    MCP_ISSUER: https://goalner.com
    MCP_RESOURCE_URL: https://goalner.com/mcp

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use goalner-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The persistent storage volume for local Active Storage files is mounted in
# the web role only (see servers), so the mcp role cannot read uploads.

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  # The MCP server's connection token cache (add-mcp-oauth design.md,
  # decisions 9 and 11): Valkey with a password, on the private kamal network
  # only (no published port), reached by the mcp role as goalner-redis. A
  # cache: nothing is persisted, and the oldest entries go first when full.
  redis:
    image: valkey/valkey:8
    host: 192.168.0.1
    cmd: >-
      sh -c 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --save "" --appendonly no
      --maxmemory 64mb --maxmemory-policy allkeys-lru'
    env:
      secret:
        - VALKEY_PASSWORD

# Other accessory examples:
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
