# Keys the application reads from encrypted credentials. Production refuses to
# boot when a required key is missing (config/initializers/required_secrets.rb).
#
# Edit production values with:
#   bin/rails credentials:edit --environment production
# which writes config/credentials/production.yml.enc. Never commit
# config/credentials/production.key or config/master.key.
#
# Required environment variables in production (not credentials):
#   DATABASE_URL      postgres://user:password@host:5432/goalner_production
#   RAILS_MASTER_KEY  or config/credentials/production.key, to decrypt this file
#   MCP_SERVICE_KEY   the MCP server's key for the connection token exchange
#                     (POST /internal/mcp_tokens); the same value as the mcp
#                     role's. Generate with `bin/rails secret`.
#   MCP_RESOURCE_URL  the MCP endpoint, https://goalner.com/mcp: the audience
#                     of MCP access tokens; the same value as the mcp role's.

# Required. Generate with `bin/rails secret`. May instead come from SECRET_KEY_BASE.
secret_key_base: ""

# Required. Outgoing mail over SMTP (design.md, Decision 14).
smtp:
  address: smtp.example.com
  port: 587               # optional, defaults to 587 with STARTTLS
  user_name: ""
  password: ""
  domain: example.com     # HELO domain

# Required. Host used in links inside emails, and the From address.
mailer:
  host: app.example.com
  from: "Goalner <no-reply@example.com>"

# Required. Sentry DSNs for the backend and the SPA (two separate projects).
# The ingest host of frontend_dsn is added to the CSP connect-src.
sentry:
  backend_dsn: https://key@o0.ingest.sentry.io/0
  frontend_dsn: https://key@o0.ingest.sentry.io/1

# Required. Where in-app feedback is delivered (spec feedback).
feedback:
  operators_email: operators@example.com

# Required. The EC P-256 key that signs MCP access tokens (add-mcp-oauth).
# Generate with:
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt
# Its public key (`openssl pkey -pubout`) goes to the mcp role as
# MCP_JWT_PUBLIC_KEYS. See the README for rotating it.
mcp:
  jwt_private_key: |
    -----BEGIN PRIVATE KEY-----
    ...
    -----END PRIVATE KEY-----
