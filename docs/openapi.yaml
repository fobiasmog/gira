# The token API (spec api-documentation), shown at /api/docs. Written by hand:
# run bin/openapi-verify after changing it, a serializer, or an action opened
# with allow_token_access.
openapi: 3.1.0
info:
  title: Goalner API
  version: "1"
  description: |
    The part of the Goalner API that personal API tokens can use: tasks,
    comments, labels, changes and file downloads in the token's project.

    Create a token in the app under Settings → API tokens, then send it in the
    `Authorization: Bearer <token>` header. A token reaches one project, and
    a read-only token may only send GET requests. Requests are limited to 300
    a minute per token.

    An agent's token works the same way, as the agent. It is issued on a
    project's Agents screen, is valid for 100 years, and reaches every project
    that both the agent and the person who issued it belong to. A token issued for
    MCP only does not work here. List an agent's own work with
    `GET /api/projects/{project_id}/tasks?view=assigned`.

    Work is grouped into changes: a project holds many open changes at once,
    each with its own tasks and board, and a change is archived when it is
    done. A change starts from an idea and moves through the phases Idea,
    Exploring, Proposed, Implementing and Done. Its thread is where agents
    ask and people answer, and its history records every phase move and
    import. Agents that plan with OpenSpec push every file of a change's
    folder with `POST /api/projects/{project_id}/openspec_changes`, which
    fills the change of that name, and save the marked `tasks.md` text it
    returns; see that operation for the whole loop. Every request that names
    a task takes its id or its key, such as `GOAL-12`, and every request that
    names a change in its path takes its id or, for an open change, its name.

    People ask for the steps of a change with requests, and a pool of agents
    takes them: an agent takes a request with `claimRequest`, does the step,
    and finishes it with `finishRequest`, which posts its comment in the
    change's thread. The agent that takes a change's first request stays on
    it until the change is archived or a person releases it, so the agent
    that asked a question gets its answer as a `reply` request.

    Errors use one JSON envelope: `{ "error": { "code", "message", "fields" } }`.

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: Profile
    description: The token's owner.
  - name: Projects
    description: The token's project, its board and its members.
  - name: Tasks
    description: Tasks, their placement on the board, label and change.
  - name: Subtasks
    description: Subtasks of a root task, and their completion.
  - name: Comments
    description: Markdown comments on tasks and in the threads of changes, with file attachments.
  - name: Labels
    description: The project's labels.
  - name: Changes
    description: Changes, the pieces of work of a project, each with its idea, phase, thread, history, OpenSpec files, tasks and board. Any number of them can be open; none is "active".
  - name: Requests
    description: Requests for the steps of a change, which agents of the project take and finish one at a time, one agent per change.
  - name: OpenSpec
    description: Importing an OpenSpec change's files into the change of that name; the sections of its tasks.md become cards and its items their subtasks.
  - name: Files
    description: Downloads of the attachments and avatars linked from other responses.

paths:
  /api/me:
    get:
      operationId: showProfile
      tags: [Profile]
      summary: The token owner's profile
      responses:
        "200":
          description: The profile of the user who owns the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      description: With a token, only the token's project.
      responses:
        "200":
          description: The token's project, in a list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{id}:
    get:
      operationId: showProject
      tags: [Projects]
      summary: Show a project
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsId"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/board:
    get:
      operationId: showBoard
      tags: [Projects]
      summary: The board
      description: |
        Everything a board shows in one response: the columns, the root tasks
        of one open change (or, without `change_id`, the tasks in no change),
        done ones included, the members, the labels, and the project's open
        changes for choosing another board.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: change_id
          in: query
          description: |
            The change whose board to show: its id, or the name of an open
            change such as `add-labels`. Omit it for the tasks in no change.
            An archived change has no board (404).
          schema:
            $ref: "#/components/schemas/ChangeRef"
      responses:
        "200":
          description: The board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/statuses:
    get:
      operationId: listColumns
      tags: [Projects]
      summary: List the board's columns
      description: |
        The board's columns without its tasks, as in the board snapshot. The
        last column is the done column. A column's `id` is the `status_id` that
        moving a task to a column takes.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The columns, in board order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/members:
    get:
      operationId: listMembers
      tags: [Projects]
      summary: List the project's members
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The members, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: view
          in: query
          description: |
            - `board` (default): root tasks on a board, done ones included, in column order: those of the change named by `change_id`, or those in no change;
            - `archived`: archived tasks, newest first;
            - `assigned`: the tasks assigned to the token's owner that are neither archived nor done, subtasks included (see `parent_id`), whatever their change, by column and then by number.
          schema:
            type: string
            enum: [board, archived, assigned]
            default: board
        - name: change_id
          in: query
          description: For `view=board`, the change whose board to list (its id, or an open change's name). An archived change has no board (404).
          schema:
            $ref: "#/components/schemas/ChangeRef"
      responses:
        "200":
          description: Task cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      description: |
        A task goes into the change named by `change_id`, which must be an open
        change of the project, or into no change without it. A task created
        without a column (`status_id`) goes to the first column.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The created task; its creator is the token's owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        description: The task's id, or its key such as `GOAL-12`.
        schema:
          type: string
          pattern: "^([1-9][0-9]*|[A-Z][A-Z0-9]*-[1-9][0-9]*)$"
    get:
      operationId: showTask
      tags: [Tasks]
      summary: Show a task
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateTask
      tags: [Tasks]
      summary: Update a task
      description: Changes only the fields given. The API also accepts PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: archiveTask
      tags: [Tasks]
      summary: Archive a task
      description: The task leaves the board and every list, and stays readable in the project's archive.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/placement:
    put:
      operationId: placeTask
      tags: [Tasks]
      summary: Move a root task to a column and position
      description: The API also accepts PATCH.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placement"
      responses:
        "200":
          description: The placed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/label:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    put:
      operationId: setTaskLabel
      tags: [Tasks]
      summary: Set a task's label
      description: A task has at most one label. The API also accepts PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_id]
              properties:
                label_id:
                  type: integer
                  description: A label of the same project.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeTaskLabel
      tags: [Tasks]
      summary: Remove a task's label
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/change:
    put:
      operationId: setTaskChange
      tags: [Tasks]
      summary: Put a root task into a change, move it to another, or take it out
      description: |
        The task keeps its column, and its subtasks follow it. A card in its
        change's `tasks.md` (`in_tasks_md`) stays in its change: to drop it,
        remove its section from `tasks.md` and import again. The API also
        accepts PATCH.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                change_id:
                  type: [integer, "null"]
                  description: An open change of the same project, or `null` (or nothing) to take the task out of its change.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/subtasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listSubtasks
      tags: [Subtasks]
      summary: List a task's subtasks
      responses:
        "200":
          description: The subtasks, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createSubtask
      tags: [Subtasks]
      summary: Add a subtask
      description: The subtask starts in the first column. Subtasks cannot have subtasks of their own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: The subtask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/completion:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: task_id
        in: path
        required: true
        description: The subtask's id, or its key such as `GOAL-12`. A root task is not found.
        schema:
          type: [integer, string]
          pattern: "^([1-9][0-9]*|[A-Z][A-Z0-9]*-[1-9][0-9]*)$"
    put:
      operationId: completeSubtask
      tags: [Subtasks]
      summary: Mark a subtask complete
      description: Moves it to the done column. The API also accepts PATCH.
      responses:
        "200":
          description: The subtask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: reopenSubtask
      tags: [Subtasks]
      summary: Mark a subtask not complete
      description: Moves it back to the first column.
      responses:
        "200":
          description: The subtask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/tasks/{task_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listComments
      tags: [Comments]
      summary: List a task's comments
      responses:
        "200":
          description: The comments, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createComment
      tags: [Comments]
      summary: Comment on a task
      description: |
        The comment's author is the token's owner. Attach up to 10 files of at
        most 10 MB each (PNG, JPEG, GIF, WebP, PDF, plain text, CSV or ZIP) by
        sending `multipart/form-data`. Archived tasks cannot be commented on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Markdown.
                attachments[]:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A comment by the token's owner, in the token's project.
        schema:
          type: integer
    patch:
      operationId: updateComment
      tags: [Comments]
      summary: Edit your comment
      description: The API also accepts PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
      responses:
        "200":
          description: The edited comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteComment
      tags: [Comments]
      summary: Delete your comment
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listLabels
      tags: [Labels]
      summary: List labels
      responses:
        "200":
          description: The labels, by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createLabel
      tags: [Labels]
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 30
                  description: Unique in the project, ignoring case.
      responses:
        "201":
          description: The label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listChanges
      tags: [Changes]
      summary: List changes
      parameters:
        - name: view
          in: query
          description: |
            - `open` (default): open changes, newest first;
            - `archived`: archived changes, most recently archived first.
          schema:
            type: string
            enum: [open, archived]
            default: open
      responses:
        "200":
          description: The changes, with their task counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createChange
      tags: [Changes]
      summary: Create a change
      description: |
        An open change in the phase Idea, with no tasks. Name it as its
        OpenSpec change folder is named, and say what the work is in `idea`.
        No two open changes of a project share a name, but a new change may
        take the name of an archived one. Importing an OpenSpec change
        (`importOpenspecChange`) creates its change too, in the phase
        Proposed and without an idea. Pick the agent that will work on it in
        `agent`, or leave it out for any free agent; picking asks for no
        step (`createRequest` does).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/ChangeName"
                idea:
                  $ref: "#/components/schemas/ChangeIdea"
                agent:
                  $ref: "#/components/schemas/ChangeAgentPick"
      responses:
        "201":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{id}:
    get:
      operationId: showChange
      tags: [Changes]
      summary: Show a change with its idea, history, files, cards and tasks.md
      description: |
        The change with its idea, its phase, whether it is waiting for people,
        its open request and its agent, its history oldest first, the paths of its OpenSpec files (read one
        with `showChangeFile`), its cards that are not archived, in column
        order, and the `tasks.md` text its last import returned, in which
        every item whose subtask is now done is checked. For a change never
        imported, the text, importer and import time are `null`. Its thread is
        listed by `listChangeComments`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeIdAsId"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: updateChange
      tags: [Changes]
      summary: Move a change to another phase, edit its idea, or pick its agent
      description: |
        Send `phase`, `idea`, `agent`, or any of them. Move the change as your work on it
        moves: to `exploring` when you start exploring its idea, and to
        `implementing` when you are told to implement it. Importing it moves
        a change in Idea or Exploring to Proposed by itself. Any of `idea`,
        `exploring`, `proposed` and `implementing` may be chosen, earlier ones
        included; Done cannot be chosen, because Goalner reports it while all
        the cards of a change in Implementing are in the done column. Each
        move is recorded in the change's history with who made it; moving to
        the phase the change is in records nothing.

        The idea can only be changed while the change is in Idea: corrections
        later go into its thread (`createChangeComment`). The agent can be
        picked or cleared only while no agent is on the change; release it
        first (`releaseChangeAgent`). An archived change cannot be changed.
        The API also accepts PUT.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeIdAsId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUpdate"
      responses:
        "200":
          description: The change, as `showChange` returns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/archival:
    post:
      operationId: archiveChange
      tags: [Changes]
      summary: Archive a change
      description: |
        Whatever the state of its tasks. They stay with the archived change and
        leave every board, and no task can be put into it any more. Its open
        request is cancelled, which frees its agent. Archiving an archived
        change changes nothing.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeId"
      responses:
        "200":
          description: The archived change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/file:
    get:
      operationId: showChangeFile
      tags: [Changes]
      summary: Read one OpenSpec file of a change
      description: |
        One file of the change's last import, exactly as it was sent:
        `proposal.md`, `design.md` or `specs/<capability>/spec.md`, as
        `showChange` lists them. A path that names no file of the change is
        a 404. `tasks.md` is not a file here: it is the `tasks_text` of
        `showChange`. Archived changes too.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeId"
        - name: path
          in: query
          required: true
          description: The file's path, such as `proposal.md` or `specs/export/spec.md`.
          schema:
            type: string
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeId"
    get:
      operationId: listChangeComments
      tags: [Comments]
      summary: List a change's thread
      description: |
        The comments of the change's thread, oldest first, as a conversation
        reads. Read it before you work on a change, and again when you wait
        for an answer. Archived changes too.
      responses:
        "200":
          description: The comments, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createChangeComment
      tags: [Comments]
      summary: Comment in a change's thread
      description: |
        Ask your questions about a change here, and report a step you have
        finished; then wait for an answer in the thread. While the newest
        comment of the thread was written by an agent, the change is shown as
        waiting for people. A person's comment on a change past Idea that has
        no open request asks the change's agent, or any free agent, to reply
        (a request of the kind `reply`). The comment's author is the token's
        owner. Attach
        up to 10 files of at most 10 MB each (PNG, JPEG, GIF, WebP, PDF, plain
        text, CSV or ZIP) by sending `multipart/form-data`. Archived changes
        cannot be commented on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBody"
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Markdown.
                attachments[]:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/requests:
    post:
      operationId: createRequest
      tags: [Requests]
      summary: Ask for the next step of a change
      description: |
        Asks the change's agent, or the first free agent of the project, to
        do one step of the change, given as `kind`:
        - `explore`: read the idea, the thread and the code, then ask your
          questions by finishing with them, or write the proposal if nothing
          is unclear;
        - `propose`: write the OpenSpec change and import every file of it
          (`importOpenspecChange`);
        - `implement`: work the change's cards until they are done, or finish
          as failed with what blocks you;
        - `archive`: archive the OpenSpec change, sync its specs and commit;
          finishing it as done archives the change in Goalner.

        Requests of the kind `reply` come from people's comments and cannot
        be asked for. A change has at most one open request, waiting or
        taken: a waiting `reply` request is replaced by the new one, and any
        other open request, or an archived change, refuses it. `comment`, if
        given, is posted in the change's thread as yours and asks for no
        reply of its own. A change with an agent picked waits for that agent;
        one with no agent waits for the first free agent.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [explore, propose, implement, archive]
                  description: The step to ask for.
                comment:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Markdown, posted in the change's thread as yours.
      responses:
        "201":
          description: The request, waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/agent_release:
    post:
      operationId: releaseChangeAgent
      tags: [Requests]
      summary: Release the agent of a change
      description: |
        Takes the change away from its agent, for example when the agent's
        terminal is gone or its context is full. The change's taken request
        is cancelled, its block ends, and the change has no agent, so its
        waiting request, if any, goes to the first free agent. The release is
        recorded in the change's history. A change with no agent is left as
        it is; an archived change cannot be changed.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeId"
      responses:
        "200":
          description: The change, as `showChange` returns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/requests/claim:
    post:
      operationId: claimRequest
      tags: [Requests]
      summary: Take the next request for you, or none
      description: |
        For agents. Takes the next request of this project for you and
        returns it as `{"request": {...}}`, or `{"request": null}` when there
        is none; the answer is always 200. You get the first of:
        1. a request you took earlier and have not finished: resume it;
        2. the waiting request of the change you are on;
        3. when you are on no open change: the oldest waiting request of a
           change that has you picked;
        4. when you are on no open change: the oldest waiting request of a
           change with no agent.

        Taking a change's first request puts you on that change until it is
        archived or a person releases you, and while you are on it you get
        only its requests. Taking `explore` moves a change in Idea to
        Exploring, and taking `implement` moves it to Implementing. What each
        kind asks you to do:
        - `explore`: read the idea, the thread and the code, then ask your
          questions by finishing with them, or write the proposal if nothing
          is unclear;
        - `propose`: write the OpenSpec change and import every file of it
          (`importOpenspecChange`);
        - `reply`: read the comments posted since your last finished request
          on this change, and answer or revise;
        - `implement`: work the change's cards until they are done, or finish
          as failed with what blocks you;
        - `archive`: archive the OpenSpec change, sync its specs and commit;
          finishing it as done archives the change in Goalner.

        Read the change (`showChange`) and its thread
        (`listChangeComments`) before you work, and finish with
        `finishRequest`. Every call is your check-in in the project: you are
        shown as online for 3 minutes after it. A person's token gets 403
        `agents_only`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The request you took, or `null`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request]
                properties:
                  request:
                    oneOf:
                      - $ref: "#/components/schemas/Request"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AgentsOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/requests/{id}/finish:
    post:
      operationId: finishRequest
      tags: [Requests]
      summary: Finish a request you took
      description: |
        Finishes a request you took as `done` or `failed`, with a comment
        that is posted in the change's thread as yours: what you did and
        where, the questions you need answered, or what blocked you.
        Finishing an `archive` request as done archives the change. When a
        person commented on the change while you worked, a `reply` request
        for you is created at once. Refused, changing nothing, when the
        request is not taken by you (a person may have cancelled it) or
        comes without a comment.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, comment]
              properties:
                outcome:
                  type: string
                  enum: [done, failed]
                comment:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Markdown, posted in the change's thread as yours.
      responses:
        "200":
          description: The finished request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/requests/{id}/cancellation:
    post:
      operationId: cancelRequest
      tags: [Requests]
      summary: Cancel an open request
      description: |
        Cancels a waiting or taken request; the agent that took it gets it no
        more. A finished request is left as it is. The change keeps its
        agent; release it with `releaseChangeAgent`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/requests/context_full:
    post:
      operationId: reportContextFull
      tags: [Requests]
      summary: Report that your context is full
      description: |
        For agents, when their context is about to be compacted. When you are
        on an open change of this project, Goalner blocks it and answers
        `{"blocked": true}`: you get none of its requests any more, your
        taken request stays taken, and the change waits for people until a
        person releases you; stop working on it. Otherwise the answer is
        `{"blocked": false}` and nothing changes. A person's token gets 403
        `agents_only`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Whether you are blocked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [blocked]
                properties:
                  blocked:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AgentsOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/changes/{change_id}/tasks:
    get:
      operationId: listChangeTasks
      tags: [Changes]
      summary: List a change's tasks
      description: Root tasks that are not archived, done ones included, in column order. Archived changes too.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ChangeId"
      responses:
        "200":
          description: The change's task cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/projects/{project_id}/openspec_changes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: importOpenspecChange
      tags: [OpenSpec]
      summary: Import an OpenSpec change
      description: |
        Fills the project's open change of that name from the files of its
        OpenSpec folder, and creates the change when there is none: you may
        create it first (`createChange`) or let the first import create it.
        Send every file of the folder: `tasks.md` as `tasks`, and, when they
        exist, `proposal.md` as `proposal`, `design.md` as `design`, and each
        `specs/<capability>/spec.md` under `specs`, keyed by its capability
        path. They become the change's files, replacing those of the last
        import, so that people can review them on the change's page; a file
        you do not send no longer belongs to the change. The response lists
        their paths but not their text (`showChangeFile` reads one).

        Each `##` section of `tasks` becomes a card titled
        `<change>: <section>`, and each checkbox item a subtask of that card;
        items before the first section go on a card `<change>: Tasks`. All of
        them belong to the change, so they show on its board, and they stay in
        it.

        An import into a change in Idea or Exploring moves it to Proposed, and
        a change the import creates starts in Proposed. A change in
        Implementing stays there. Every import is recorded in the change's
        history.

        The response's `tasks_text` is the same text with every heading and
        item marked with its task's key, such as `<!-- goalner:GOAL-12 -->`,
        and the items done in Goalner checked. Save it into `tasks.md`: later
        imports match sections and items by these marks, so renumbering or
        rewording keeps each task with its assignee and comments. A re-import
        whose text carries no mark at all is refused with 409 `keys_missing`,
        which carries the marked text to save.

        How an agent works through a change:
        1. Read the change's idea (`showChange`) and its thread
           (`listChangeComments`).
        2. Move it to Exploring (`updateChange` with `phase: exploring`), and
           explore. Ask your questions in its thread (`createChangeComment`)
           and wait for the answers there.
        3. Write the OpenSpec change, import every file of its folder, and
           save the returned `tasks_text` into `tasks.md`. The change is now
           Proposed: wait in the thread until you are told to implement it.
        4. Move it to Implementing (`updateChange`). Take a card assigned to
           you (`listTasks` with `view=assigned`), and work through its
           subtasks in order.
        5. Complete each subtask (`completeSubtask`, with the key from its
           mark), check its box in `tasks.md`, and commit.
        6. Move the card to the done column (`placeTask`).
        7. Import again, and save the returned `tasks_text`.
        8. When the change is done, archive it (`archiveChange`).

        A checked item completes its subtask, a subtask done in Goalner is
        checked in the returned text, and an import never reopens anything.
        Tasks whose marks are gone from the text are archived. Tasks added to
        the change by hand are left alone, unless a mark names one, which
        makes it that section's card or that item's subtask. The text is the
        source of titles and descriptions; discuss in the change's thread or
        in a task's comments.

        An import that creates the change answers 201, one into an open change
        200. The marks of an archived change are refused: its name may be
        taken by a new change, which starts without marks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenspecImport"
      responses:
        "201":
          description: The change, created by this import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "200":
          description: The change, which was open already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The change already has `tasks.md` cards, but the text carries none
            of their marks: the text the last import returned was not saved.
            Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenspecKeysMissing"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /files/{signed_id}:
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download a file
      description: |
        An attachment of a comment in the token's project, or the avatar of one
        of its members. Use the `url` of an attachment or the `avatar_url` of a
        user as it is.
      parameters:
        - $ref: "#/components/parameters/SignedId"
      responses:
        "200":
          description: "The file, as a download (`Content-Disposition: attachment`)."
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/FileUnauthorized"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "429":
          $ref: "#/components/responses/FileRateLimited"

  /files/{signed_id}/{variant}:
    get:
      operationId: downloadFilePreview
      tags: [Files]
      summary: Download a file's preview
      description: A WebP thumbnail of an image or PDF attachment, from its `preview_url`.
      parameters:
        - $ref: "#/components/parameters/SignedId"
        - name: variant
          in: path
          required: true
          schema:
            type: string
            enum: [preview]
      responses:
        "200":
          description: "The file, as a download (`Content-Disposition: attachment`)."
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/FileUnauthorized"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "429":
          $ref: "#/components/responses/FileRateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API token or an agent's token, starting with `glnr_`.

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The token's project.
      schema:
        type: integer
    ProjectIdAsId:
      name: id
      in: path
      required: true
      description: The token's project.
      schema:
        type: integer
    TaskId:
      name: task_id
      in: path
      required: true
      description: The task's id, or its key such as `GOAL-12`.
      schema:
        type: [integer, string]
        pattern: "^([1-9][0-9]*|[A-Z][A-Z0-9]*-[1-9][0-9]*)$"
    ChangeId:
      name: change_id
      in: path
      required: true
      description: The change's id, or the name of an open change such as `add-labels`. A value made only of digits is an id.
      schema:
        $ref: "#/components/schemas/ChangeRef"
    ChangeIdAsId:
      name: id
      in: path
      required: true
      description: The change's id, or the name of an open change such as `add-labels`. A value made only of digits is an id.
      schema:
        $ref: "#/components/schemas/ChangeRef"
    RequestId:
      name: id
      in: path
      required: true
      description: The request's id, as `claimRequest` returned it.
      schema:
        type: integer
    SignedId:
      name: signed_id
      in: path
      required: true
      description: The file's signed id, as it appears in its URL.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        The token is missing, unknown, expired or revoked, or it is an agent's
        token used where it was not issued for (`invalid_token`). The code
        `invalid_service_key` only answers a request that carries a service
        key header, which the MCP server sends and API clients never do.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_token
              message: The API token is missing, invalid or expired.
    InsufficientScope:
      description: The token is read-only, and this request would change data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: insufficient_scope
              message: This API token is read-only.
    AgentsOnly:
      description: |
        The token is read-only (`insufficient_scope`), or it is a person's
        token, and only agents may do this (`agents_only`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: agents_only
              message: Only agents can do this. Connect with an agent's token.
    NotFound:
      description: |
        The record does not exist, or is outside the token's project. Another
        project of the token's owner is answered the same way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Not found.
    ValidationFailed:
      description: Some fields are invalid; `fields` names them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid.
              fields:
                title: ["Title can't be blank"]
    FileUnauthorized:
      description: The token is missing, unknown, expired or revoked. No body.
    FileNotFound:
      description: The file does not exist, or the token may not see it. The body is the application's HTML not-found page.
      content:
        text/html:
          schema:
            type: string
    FileRateLimited:
      description: More than 300 requests in a minute with this token. No body.
    RateLimited:
      description: More than 300 requests in a minute with this token. The request was not processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again later.

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_token, invalid_service_key, insufficient_scope, agents_only, not_found, validation_failed, rate_limited, internal_error]
            message:
              type: string
              description: A human-readable message, in English.
            fields:
              type: object
              description: For `validation_failed`, the messages for each invalid field, keyed by field name.
              additionalProperties:
                type: array
                items:
                  type: string

    # Open sets of fields that closed schemas below combine with allOf.
    UserCardFields:
      type: object
      required: [id, name, email_address, avatar_url, agent, deleted]
      properties:
        id:
          type: integer
        name:
          type: string
        email_address:
          type: string
          format: email
          description: An agent has a generated address here, which receives no mail.
        avatar_url:
          type: [string, "null"]
          description: A `/files/...` URL; download it with the same token.
        agent:
          type: boolean
          description: Whether this is an agent's account rather than a person's.
        deleted:
          type: boolean
          description: |
            True only for a deleted agent. It still appears as the creator,
            author or assignee of its past work, but is not among a project's
            members and cannot be assigned tasks.

    UserCard:
      description: A user as teammates see them.
      allOf:
        - $ref: "#/components/schemas/UserCardFields"
      unevaluatedProperties: false

    Profile:
      description: The token owner's own profile.
      allOf:
        - $ref: "#/components/schemas/UserCardFields"
        - type: object
          required: [lang, contact_links, admin]
          properties:
            lang:
              type: string
              enum: [en, ru]
            contact_links:
              type: object
              additionalProperties: false
              properties:
                fb: { type: string, format: uri }
                vk: { type: string, format: uri }
                tg: { type: string, format: uri }
                ig: { type: string, format: uri }
                slack: { type: string, format: uri }
            admin:
              type: boolean
      unevaluatedProperties: false

    Project:
      type: object
      additionalProperties: false
      required: [id, title, short_name, owner_id, owned_by_me]
      properties:
        id:
          type: integer
        title:
          type: string
        short_name:
          type: string
          description: The prefix of task keys, such as `GOAL` in `GOAL-12`.
        owner_id:
          type: integer
        owned_by_me:
          type: boolean
          description: Whether the token's owner owns the project.

    Column:
      type: object
      additionalProperties: false
      required: [id, title, color, position, done]
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: [string, "null"]
        position:
          type: integer
        done:
          type: boolean
          description: Tasks in the done column are complete.

    Label:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string

    Board:
      type: object
      additionalProperties: false
      required: [project, columns, tasks, members, labels, change, changes]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskCard"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserCard"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        change:
          description: The change whose board this is, or `null` for the tasks in no change.
          oneOf:
            - $ref: "#/components/schemas/ChangeReference"
            - type: "null"
        changes:
          type: array
          description: The project's open changes, newest first.
          items:
            $ref: "#/components/schemas/Change"

    TaskCardFields:
      type: object
      required: [id, number, key, title, status_id, position, parent_id, change_id, change, in_tasks_md, label_id, assignee_id,
        deadline, important, completed_at, archived_at, subtask_count, subtask_done_count, comment_count]
      properties:
        id:
          type: integer
        number:
          type: integer
          description: The task's number in its project.
        key:
          type: string
          description: The project's short name and the number, such as `GOAL-12`.
        title:
          type: string
        status_id:
          type: integer
          description: The task's column.
        position:
          type: [integer, "null"]
          description: The position in its column, from 0; `null` for archived tasks.
        parent_id:
          type: [integer, "null"]
          description: For a subtask, its root task.
        change_id:
          type: [integer, "null"]
          description: The change the task belongs to; a subtask always belongs to its card's.
        change:
          oneOf:
            - $ref: "#/components/schemas/ChangeReference"
            - type: "null"
        in_tasks_md:
          type: boolean
          description: |
            Whether the task's mark is in its change's `tasks.md`, so that
            imports update it. Such a card stays in its change.
        label_id:
          type: [integer, "null"]
        assignee_id:
          type: [integer, "null"]
        deadline:
          type: [string, "null"]
          format: date-time
        important:
          type: boolean
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the task reached the done column.
        archived_at:
          type: [string, "null"]
          format: date-time
        subtask_count:
          type: integer
        subtask_done_count:
          type: integer
        comment_count:
          type: integer

    TaskCard:
      description: A task as boards and lists show it.
      allOf:
        - $ref: "#/components/schemas/TaskCardFields"
      unevaluatedProperties: false

    TaskDetail:
      description: A task with its description, people, column, label, change and subtasks.
      allOf:
        - $ref: "#/components/schemas/TaskCardFields"
        - type: object
          required: [description, created_at, creator, assignee, status, label, subtasks]
          properties:
            description:
              type: string
              description: Markdown.
            created_at:
              type: string
              format: date-time
            creator:
              oneOf:
                - $ref: "#/components/schemas/UserCard"
                - type: "null"
            assignee:
              oneOf:
                - $ref: "#/components/schemas/UserCard"
                - type: "null"
            status:
              type: object
              additionalProperties: false
              required: [id, title, done]
              properties:
                id: { type: integer }
                title: { type: string }
                done: { type: boolean }
            label:
              oneOf:
                - $ref: "#/components/schemas/Label"
                - type: "null"
            subtasks:
              type: array
              items:
                $ref: "#/components/schemas/Subtask"
      unevaluatedProperties: false

    Subtask:
      type: object
      additionalProperties: false
      required: [id, number, key, title, complete]
      properties:
        id: { type: integer }
        number: { type: integer }
        key: { type: string }
        title: { type: string }
        complete:
          type: boolean
          description: Whether the subtask is in the done column.

    ChangeName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Groups of lowercase Latin letters and digits joined by single hyphens, such as `add-labels`.

    ChangeRef:
      type: [integer, string]
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 100
      description: A change's id, or the name of an open change. A value made only of digits is an id.

    ChangeReference:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    TaskCounts:
      type: object
      additionalProperties: false
      required: [by_status, total]
      description: The change's root tasks that are not archived; subtasks are not counted.
      properties:
        by_status:
          type: object
          description: Per column id.
          additionalProperties:
            type: integer
        total:
          type: integer

    ChangeIdea:
      type: [string, "null"]
      maxLength: 100000
      description: Markdown that says what the work is, stored exactly as written. It can be changed only while the change is in Idea.

    ChangePhase:
      type: string
      enum: [idea, exploring, proposed, implementing, done]
      description: |
        Where the change is: `idea`, `exploring`, `proposed`, `implementing`
        or `done`, in that order. `done` is reported while the change is in
        Implementing and all its cards, and at least one, are in the done
        column; it cannot be chosen.

    ChangeFields:
      type: object
      required: [id, name, archived_at, phase, waiting_for_people, task_counts, request, agent]
      properties:
        id: { type: integer }
        name:
          type: string
          description: The change's name, which is the name of its OpenSpec folder, such as `add-labels`.
        archived_at:
          type: [string, "null"]
          format: date-time
          description: When the change was archived; `null` while it is open.
        phase:
          $ref: "#/components/schemas/ChangePhase"
        waiting_for_people:
          type: boolean
          description: |
            Whether the change waits for people: its agent's context is full,
            or it has no open request and the newest comment of its thread
            was written by an agent. Never true for an archived change.
        task_counts:
          $ref: "#/components/schemas/TaskCounts"
        request:
          description: The change's open request, waiting or taken; `null` when it has none.
          oneOf:
            - $ref: "#/components/schemas/Request"
            - type: "null"
        agent:
          description: The change's agent, picked or on the change; `null` for any free agent.
          oneOf:
            - $ref: "#/components/schemas/ChangeAgent"
            - type: "null"

    Change:
      description: A change as lists show it.
      allOf:
        - $ref: "#/components/schemas/ChangeFields"
      unevaluatedProperties: false

    ChangeDetail:
      description: A change with its idea, history, files, cards and last OpenSpec import.
      allOf:
        - $ref: "#/components/schemas/ChangeFields"
        - type: object
          required: [idea, imported_by, imported_at, tasks_text, history, files, cards]
          properties:
            idea:
              $ref: "#/components/schemas/ChangeIdea"
            history:
              type: array
              description: |
                Every phase move, import, request asked for, taken, finished
                and cancelled, release and block of the change, oldest first.
              items:
                $ref: "#/components/schemas/ChangeEvent"
            files:
              type: array
              description: |
                The OpenSpec files of the change's last import, `proposal.md`
                first, then `design.md`, then the spec files by path. Read one
                with `showChangeFile`.
              items:
                type: object
                additionalProperties: false
                required: [path, length]
                properties:
                  path: { type: string }
                  length:
                    type: integer
                    description: In characters.
            imported_by:
              description: Who imported the change last; `null` until the first import.
              oneOf:
                - $ref: "#/components/schemas/UserCard"
                - type: "null"
            imported_at:
              type: [string, "null"]
              format: date-time
            tasks_text:
              type: [string, "null"]
              description: |
                The change's `tasks.md` with every heading and item marked with its
                task's key, and the items done in Goalner checked. Save it into
                `tasks.md`. `null` until the first import.
            cards:
              type: array
              description: The change's cards that are not archived, in column order.
              items:
                $ref: "#/components/schemas/TaskCard"
      unevaluatedProperties: false

    ChangeUpdate:
      type: object
      properties:
        phase:
          type: string
          enum: [idea, exploring, proposed, implementing]
          description: The phase to move the change to.
        idea:
          $ref: "#/components/schemas/ChangeIdea"
        agent:
          $ref: "#/components/schemas/ChangeAgentPick"

    ChangeAgentPick:
      type: [integer, "null"]
      description: |
        The user id of an agent of the project (`listMembers`, where `agent`
        is true) to pick for the change, or `null` for any free agent.
        Refused while an agent is on the change.

    ChangeAgent:
      type: object
      additionalProperties: false
      required: [user, "on", since, blocked_at]
      properties:
        user:
          $ref: "#/components/schemas/UserCard"
        "on":
          type: boolean
          description: |
            True once the agent took the change's first request: every request
            of the change goes to it until the change is archived or the agent
            is released. False while the agent is only picked.
        since:
          type: [string, "null"]
          format: date-time
          description: When the agent took the change's first request.
        blocked_at:
          type: [string, "null"]
          format: date-time
          description: |
            Since when the change is blocked because the agent's context is
            full (`reportContextFull`); `null` when it is not. A blocked
            change gives its agent no request until a person releases it.

    Request:
      type: object
      additionalProperties: false
      required: [id, kind, state, change, requested_by, taken_by, finished_by, created_at, taken_at, finished_at]
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/RequestKind"
        state:
          type: string
          enum: [waiting, taken, done, failed, cancelled]
          description: Waiting until an agent takes it, then taken, then done, failed or cancelled. A waiting or taken request is open.
        change:
          type: object
          additionalProperties: false
          required: [id, name, phase]
          properties:
            id: { type: integer }
            name: { type: string }
            phase:
              $ref: "#/components/schemas/ChangePhase"
        requested_by:
          $ref: "#/components/schemas/UserCard"
        taken_by:
          description: The agent that took it; `null` while it waits.
          oneOf:
            - $ref: "#/components/schemas/UserCard"
            - type: "null"
        finished_by:
          description: The agent that finished it, or who cancelled it; `null` while it is open.
          oneOf:
            - $ref: "#/components/schemas/UserCard"
            - type: "null"
        created_at:
          type: string
          format: date-time
          description: When it was asked for.
        taken_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When it was finished or cancelled.

    RequestKind:
      type: string
      enum: [explore, propose, implement, archive, reply]
      description: |
        The step asked for:
        - `explore`: read the idea, the thread and the code, then ask
          questions by finishing with them, or write the proposal if nothing
          is unclear;
        - `propose`: write the OpenSpec change and import every file of it;
        - `implement`: work the change's cards until they are done, or finish
          as failed with what blocks;
        - `archive`: archive the OpenSpec change, sync its specs and commit;
          finishing it as done archives the change in Goalner;
        - `reply`: read the comments posted since the last finished request
          on the change, and answer or revise. Created by people's comments.

    ChangeEvent:
      type: object
      additionalProperties: false
      required: [kind, actor, phase, paths, agent, step, state, created_at]
      properties:
        kind:
          type: string
          enum: [phase, import, request, release, block]
          description: |
            A move to another phase, an import, a step of a request, the
            release of the change's agent, or a block because the agent's
            context is full.
        actor:
          $ref: "#/components/schemas/UserCard"
        phase:
          type: [string, "null"]
          enum: [idea, exploring, proposed, implementing, null]
          description: The phase moved to; `null` for the other kinds.
        paths:
          type: [array, "null"]
          description: The files the import brought, `tasks.md` included; `null` for the other kinds.
          items:
            type: string
        agent:
          description: The released agent; `null` for the other kinds.
          oneOf:
            - $ref: "#/components/schemas/UserCard"
            - type: "null"
        step:
          description: The request's kind; `null` for the other kinds.
          oneOf:
            - $ref: "#/components/schemas/RequestKind"
            - type: "null"
        state:
          type: [string, "null"]
          enum: [asked, taken, done, failed, cancelled, null]
          description: What happened to the request; `null` for the other kinds.
        created_at:
          type: string
          format: date-time

    ChangeFile:
      type: object
      additionalProperties: false
      required: [path, text]
      properties:
        path: { type: string }
        text:
          type: string
          description: The file's text exactly as imported.

    OpenspecImport:
      type: object
      required: [name, artifacts]
      properties:
        name:
          $ref: "#/components/schemas/ChangeName"
        artifacts:
          type: object
          additionalProperties: false
          required: [tasks]
          description: Every file of the change's folder, each as it is in the repository.
          properties:
            tasks:
              type: string
              maxLength: 100000
              description: |
                The text of the change's `tasks.md` as it is in the repository,
                with the marks of earlier imports. At most 50 sections and 500
                items.
            proposal:
              type: string
              maxLength: 100000
              description: The text of the change's `proposal.md`.
            design:
              type: string
              maxLength: 100000
              description: The text of the change's `design.md`.
            specs:
              type: object
              maxProperties: 50
              description: |
                The change's delta specs: each key is the path of a folder under
                the change's `specs/`, such as `export` or `identity/user-auth`,
                and its value the text of that folder's `spec.md`.
              propertyNames:
                pattern: "^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$"
              additionalProperties:
                type: string
                maxLength: 100000

    OpenspecKeysMissing:
      type: object
      additionalProperties: false
      required: [error, tasks_text]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [keys_missing]
            message:
              type: string
        tasks_text:
          type: string
          description: The change's marked text, as `showChange` returns it. Save it into `tasks.md`, redo your edits, and import again.

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 100000
          description: Markdown.
        deadline:
          type: [string, "null"]
          format: date-time
        important:
          type: boolean
        assignee_id:
          type: [integer, "null"]
          description: A member of the project.
        status_id:
          type: [integer, "null"]
          description: The column; the first column when omitted.
        label_id:
          type: [integer, "null"]
        change_id:
          type: [integer, "null"]
          description: An open change of the project, or `null` (or nothing) for no change.

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 100000
        deadline:
          type: [string, "null"]
          format: date-time
        important:
          type: boolean
        assignee_id:
          type: [integer, "null"]

    Placement:
      type: object
      required: [status_id]
      properties:
        status_id:
          type: integer
          description: The column to move the task to.
        position:
          type: integer
          minimum: 0
          default: 0
          description: The position in the column among the tasks of the same change, from 0; larger values put the task last.

    CommentBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Markdown, stored and returned exactly as written.

    Comment:
      type: object
      additionalProperties: false
      required: [id, body, author, created_at, updated_at, attachments]
      properties:
        id: { type: integer }
        body:
          type: string
          description: Markdown, exactly as written.
        author:
          $ref: "#/components/schemas/UserCard"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    Attachment:
      type: object
      additionalProperties: false
      required: [filename, byte_size, content_type, url, preview_url]
      properties:
        filename: { type: string }
        byte_size: { type: integer }
        content_type: { type: string }
        url:
          type: string
          description: A `/files/...` URL; download it with the same token.
        preview_url:
          type: [string, "null"]
          description: A smaller preview, for images and PDFs.
